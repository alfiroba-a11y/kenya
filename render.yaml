services:
  - type: web
    name: xcrow
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HASHPAY_API_KEY
        sync: false
      - key: HASHPAY_ACCOUNT_ID
        sync: false
      - key: HASHPAY_ORGANIZATION_ID
        sync: false
      - key: HASHPAY_WEBHOOK_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: XCROW Administrator
      - key: KES_PAYMENT_INSTRUCTIONS
        sync: false
      - key: USD_KES_RATE
        value: "130"
